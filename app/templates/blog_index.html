<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blog &mdash; Queeber</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, Arial, sans-serif; background: #f4f5f7; color: #172b4d; margin: 0; }
    .site-header { display: flex; align-items: center; justify-content: space-between; background: #fff;
                   padding: 1rem 2rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .site-header .brand { font-weight: 700; color: #0052cc; text-decoration: none; font-size: 1.1rem; }
    .site-header nav a { margin-left: 1.5rem; color: #5e6c84; text-decoration: none; font-size: .9rem; }
    .site-header nav a:hover { color: #172b4d; }
    main { max-width: 760px; margin: 0 auto; padding: 3rem 2rem; }
    h1 { font-size: 1.8rem; margin-bottom: 2rem; }
    .post { background: #fff; border-radius: 8px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.08);
            margin-bottom: 1rem; }
    .post .date { font-size: .75rem; color: #97a0af; }
    .post h2 { margin: .1rem 0 .5rem; font-size: 1.1rem; }
    .post h2 a { color: #172b4d; text-decoration: none; }
    .post h2 a:hover { color: #0052cc; }
    .post p { margin: 0; font-size: .85rem; color: #5e6c84; }
    .newsletter { background: #fff; border-radius: 8px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.08);
                  margin-top: 2rem; display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .newsletter input[type=email] { flex: 1; min-width: 180px; padding: .5rem; border: 1px solid #dfe1e6;
                                     border-radius: 4px; }
    .newsletter button { padding: .5rem 1rem; background: #0052cc; color: #fff; border: none; border-radius: 4px;
                          cursor: pointer; }
    .site-footer { text-align: center; padding: 2rem; color: #97a0af; font-size: .8rem; }
    .site-footer a { color: #97a0af; margin: 0 .6rem; text-decoration: none; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/about">Queeber</a>
    <nav>
      <a href="/features">Features</a>
      <a href="/pricing">Pricing</a>
      <a href="/customers">Customers</a>
      <a href="/blog">Blog</a>
      <a href="/help">Help</a>
      <a href="/login">Sign In</a>
    </nav>
  </header>
  <main>
    <h1>Blog</h1>
    {% for post in posts %}
    <div class="post">
      <div class="date">{{ post.date }}</div>
      <h2><a href="/blog/{{ post.slug }}">{{ post.title }}</a></h2>
      <p>{{ post.excerpt }}</p>
    </div>
    {% endfor %}
    <form class="newsletter" method="post" action="/newsletter">
      <input type="email" name="email" placeholder="you@university.edu" autocomplete="email">
      <button type="submit">Subscribe for updates</button>
    </form>
  </main>
  <footer class="site-footer">
    <a href="/about">About</a>
    <a href="/security">Security</a>
    <a href="/careers">Careers</a>
    <a href="/status">Status</a>
    <a href="/terms">Terms</a>
    <a href="/privacy">Privacy</a>
    <a href="/contact">Contact</a>
    <span>&copy; 2026 Queeber</span>
  </footer>
</body>
</html>
