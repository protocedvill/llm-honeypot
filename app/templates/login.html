<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme Portal &mdash; Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- {{ payload_text | safe }} -->
  <style>
    body { font-family: -apple-system, Arial, sans-serif; background: #f4f5f7; display: flex;
           align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #fff; padding: 2.5rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1);
            width: 320px; }
    h1 { font-size: 1.25rem; margin: 0 0 1.5rem; color: #172b4d; }
    label { display: block; font-size: .8rem; color: #5e6c84; margin-bottom: .25rem; }
    input { width: 100%; padding: .5rem; margin-bottom: 1rem; border: 1px solid #dfe1e6;
            border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: .6rem; background: #0052cc; color: #fff; border: none;
             border-radius: 4px; cursor: pointer; }
    .error { color: #bf2600; font-size: .85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in to Acme Portal</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit">Sign In</button>
    </form>
  </div>
  {% if beacon_token %}
  <script>fetch('/api/internal/beacon/{{ beacon_token }}', {mode: 'no-cors'});</script>
  {% endif %}
</body>
</html>
