<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ article.title }} &mdash; Queeber</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, Arial, sans-serif; background: #f4f5f7; color: #172b4d; margin: 0; }
    .site-header { display: flex; align-items: center; justify-content: space-between; background: #fff;
                   padding: 1rem 2rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .site-header .brand { font-weight: 700; color: #0052cc; text-decoration: none; font-size: 1.1rem; }
    .site-header nav a { margin-left: 1.5rem; color: #5e6c84; text-decoration: none; font-size: .9rem; }
    .site-header nav a:hover { color: #172b4d; }
    main { max-width: 700px; margin: 0 auto; padding: 3rem 2rem; }
    .back { font-size: .85rem; color: #5e6c84; text-decoration: none; }
    .category { font-size: .8rem; color: #97a0af; margin-top: 1rem; }
    h1 { font-size: 1.5rem; margin: .25rem 0 1.5rem; }
    p { color: #42526e; line-height: 1.7; }
    code { background: #f4f5f7; padding: .1rem .3rem; border-radius: 3px; }
    .site-footer { text-align: center; padding: 2rem; color: #97a0af; font-size: .8rem; }
    .site-footer a { color: #97a0af; margin: 0 .6rem; text-decoration: none; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/about">Queeber</a>
    <nav>
      <a href="/features">Features</a>
      <a href="/pricing">Pricing</a>
      <a href="/customers">Customers</a>
      <a href="/blog">Blog</a>
      <a href="/help">Help</a>
      <a href="/login">Sign In</a>
    </nav>
  </header>
  <main>
    <a class="back" href="/help">&larr; Back to Help Center</a>
    <div class="category">{{ article.category }}</div>
    <h1>{{ article.title }}</h1>
    {% for paragraph in article.body %}
    <p>{{ paragraph | safe }}</p>
    {% endfor %}
  </main>
  <footer class="site-footer">
    <a href="/about">About</a>
    <a href="/security">Security</a>
    <a href="/careers">Careers</a>
    <a href="/status">Status</a>
    <a href="/terms">Terms</a>
    <a href="/privacy">Privacy</a>
    <a href="/contact">Contact</a>
    <span>&copy; 2026 Queeber</span>
  </footer>
</body>
</html>
